<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Lista de Tarefas</h2>

<form id="formTarefa">
    <input type="text" id="nome" placeholder="Nome da tarefa" required>
    <input type="number" id="custo" placeholder="Custo (R$)" min="0" step="0.01" required>
    <input type="date" id="data" required>
    <button type="submit">Adicionar</button>
</form>


<table>
    <thead>
        <tr>
            <th>Nome</th>
            <th>Custo</th>
            <th>Data Limite</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody id="lista"></tbody>
    <tfoot>
        <tr>
            <td colspan="4" id="total"></td>
        </tr>
    </tfoot>
</table>

<script src="script.js"></script>
</body>
</html>
