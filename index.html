<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Lista de Tarefas</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Custo</th>
                <th>Data Limite</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
        <tfoot>
            <tr>
                <td colspan="4" id="total"></td>
            </tr>
        </tfoot>
    </table>

    <div class="actions-bar">
        <button onclick="abrirModal()" class="btn-add">Incluir Nova Tarefa</button>
    </div>

</div>

<div id="modalTarefa" class="modal">
    <div class="modal-content">
        <h3 id="modalTitulo">Tarefa</h3>
        <form id="formTarefa">
            <input type="hidden" id="editIndex">
            
            <label>Nome da Tarefa:</label>
            <input type="text" id="nome" required>
            <span id="erroNome" class="erro"></span>

            <label>Custo (R$):</label>
            <input type="number" id="custo" step="0.01" min="0" required>

            <label>Data Limite:</label>
            <input type="date" id="data" required>

            <div class="modal-buttons">
                <button type="button" onclick="fecharModal()">Cancelar</button>
                <button type="submit">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>

</html>
